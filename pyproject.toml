[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "ygorl"
version = "0.1.0"
description = "Yu-Gi-Oh! reinforcement learning engine: play, deck building, opponent modeling."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "nashpy>=0.0.43",
    "numpy>=2.4.6",
    "ribs>=0.12",
]

[project.optional-dependencies]
# Policy training (M4). PyPI's Linux wheel bundles the CUDA runtime (~5 GB installed).
train = ["torch>=2.6"]
text = [
    "sentence-transformers>=3",
]

[project.scripts]
ygorl = "ygorl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# ruff's classic default set; newer ruff releases enable more rules by default.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tools/tsan/run_pool.py" = ["E402", "E731"]  # must import the instrumented build from a custom path first

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/ygorl"]

[tool.uv]
# Rebuild the C++ extension whenever native sources or build files change.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "cmake/**/*.cmake" },
  { file = "patches/**/*.patch" },
  { file = "csrc/**/*.cpp" },
  { file = "csrc/**/*.h" },
  { file = "csrc/**/*.map" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
